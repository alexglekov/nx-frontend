name: Build push and deploy main branch
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      VITE_TECH_ISSUES_FLAG:
        description: 'Enable maintenance'
        required: true
        default: false

jobs:
  build:
    name: build and deploy
    runs-on: werf
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          submodules: 'true'

      - name: Update submodules
        id: update
        run: git submodule update --remote --recursive

      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v5

      - name: Npm build
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@xyro-io'
      - run: npm install -g nx@latest
      - run: |
          npm ci
          cd apps/web3
          npm ci
          cd ../offchain
          npm ci
          cd ../..
          nx build offchain
          nx build web3
        env:
          VITE_BACKEND_URL: backend-prod.xyro.io
          VITE_STAND: mainnet
          VITE_THIRD_WEB_API_KEY: 3c0d5e17df9272071f4e2c7357e377f4
          VITE_WSS_PROVIDER: wss://arbitrum.callstaticrpc.com
          VITE_HTTP_PROVIDER: https://rpc.ankr.com/arbitrum
          VITE_ETH_HTTP_PROVIDER: https://rpc.ankr.com/eth
          VITE_TECH_ISSUES_FLAG: ${{ github.event.inputs.VITE_TECH_ISSUES_FLAG }}
      - run: npm install -g wrangler

      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID}}
        run: |
          wrangler pages deploy apps/offchain/dist/ --project-name offchain-main --branch=main
          wrangler pages deploy apps/web3/dist/ --project-name mainnet --branch=main
