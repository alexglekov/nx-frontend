name: Deploy Frontend to Dev

on:
  push:
    branches: [dev]

jobs:
  build-web3:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.TOKEN_GITHUB }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web3
          push: true
          tags: ghcr.io/xyro-io/frontend-web3:dev
          build-args: |
            VITE_BACKEND_URL=https://api.dev.xyro.io
            VITE_STAND=dev
          cache-from: type=gha,scope=web3
          cache-to: type=gha,scope=web3,mode=max

  build-offchain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.offchain
          push: true
          tags: ghcr.io/xyro-io/frontend-offchain:dev
          build-args: |
            VITE_BACKEND_URL=https://api.dev.xyro.io
            VITE_STAND=dev
          cache-from: type=gha,scope=offchain
          cache-to: type=gha,scope=offchain,mode=max

  deploy:
    needs: [build-web3, build-offchain]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to cluster
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: root
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            export KUBECONFIG=/etc/rancher/rke2/rke2.yaml
            export PATH=$PATH:/var/lib/rancher/rke2/bin

            kubectl rollout restart deploy/frontend-web3 -n xyro-app
            kubectl rollout restart deploy/frontend-offchain -n xyro-app

            kubectl rollout status deploy/frontend-web3 -n xyro-app --timeout=120s
            kubectl rollout status deploy/frontend-offchain -n xyro-app --timeout=120s
